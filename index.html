<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cc-agent-go WebAgent</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }
        * { box-sizing: border-box; }
        body { margin: 0; }
        main { max-width: 1120px; margin: 0 auto; padding: 32px 20px 60px; }
        header { margin-bottom: 24px; }
        h1 { margin: 0 0 8px; font-size: 30px; }
        .subtitle { margin: 0; color: #62708a; }
        .layout { display: grid; grid-template-columns: 390px 1fr; gap: 20px; }
        .panel {
            background: white;
            border: 1px solid #dfe6f1;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(31, 50, 81, .07);
            padding: 20px;
        }
        label { display: block; margin: 0 0 7px; font-size: 13px; font-weight: 700; }
        input, textarea {
            width: 100%;
            border: 1px solid #cfd9e8;
            border-radius: 10px;
            padding: 11px 12px;
            font: inherit;
            color: #172033;
            background: #fbfcfe;
        }
        input:focus, textarea:focus {
            outline: 2px solid #a8c7ff;
            border-color: #72a3f7;
        }
        textarea { min-height: 180px; resize: vertical; line-height: 1.6; }
        .field { margin-bottom: 16px; }
        button {
            border: 0;
            border-radius: 10px;
            padding: 11px 15px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: .55; cursor: not-allowed; }
        .primary { width: 100%; color: white; background: #2563eb; }
        .secondary { color: #1e4e98; background: #e8f0ff; }
        .status {
            margin-top: 14px;
            border-radius: 10px;
            padding: 10px 12px;
            color: #53627b;
            background: #f2f5fa;
            font-size: 13px;
        }
        .status.running { color: #795700; background: #fff5cc; }
        .status.failed { color: #9f1d2b; background: #ffe9ec; }
        .status.completed { color: #116b46; background: #e2f8ee; }
        .panel-title { margin: 0 0 15px; font-size: 17px; }
        #event-list { display: grid; gap: 9px; max-height: 420px; overflow: auto; }
        .event {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 12px;
            border: 1px solid #e2e8f2;
            border-radius: 10px;
            padding: 10px 12px;
            background: #fafcff;
            font-size: 13px;
        }
        .event-name { color: #315d9f; font-family: ui-monospace, monospace; }
        .event-value { color: #44516a; white-space: pre-wrap; overflow-wrap: anywhere; }
        #final-result {
            min-height: 150px;
            margin: 0;
            white-space: pre-wrap;
            line-height: 1.65;
            overflow-wrap: anywhere;
        }
        .stack { display: grid; gap: 20px; }
        .mcp-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-top: 1px solid #edf0f5;
            padding: 10px 0;
        }
        .mcp-row:first-child { border-top: 0; }
        .mcp-name { font-weight: 700; }
        .mcp-state { color: #68768e; font-size: 12px; }
        .actions { display: flex; gap: 8px; margin-bottom: 10px; }
        @media (max-width: 850px) {
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>cc-agent-go WebAgent</h1>
        <p class="subtitle">传入项目工作目录、会话编号和当前任务；页面显示这一次 Agent.Run 的实际事件。</p>
    </header>

    <div class="layout">
        <section class="panel">
            <h2 class="panel-title">开始一次 Agent 任务</h2>
            <form id="agent-task-form">
                <div class="field">
                    <label for="working-directory">项目工作目录</label>
                    <input id="working-directory" name="workingDirectory"
                           placeholder="C:\Users\Z\Documents\project\code\example" required>
                </div>
                <div class="field">
                    <label for="conversation-id">会话编号</label>
                    <input id="conversation-id" name="conversationId"
                           value="webagent-main" pattern="[A-Za-z0-9._-]{1,100}" required>
                </div>
                <div class="field">
                    <label for="task-message">当前任务</label>
                    <textarea id="task-message" name="message"
                              placeholder="写出本次要 Agent 完成的具体任务" required></textarea>
                </div>
                <button id="start-agent" class="primary" type="submit">开始执行</button>
            </form>
            <div id="run-status" class="status">尚未开始</div>
        </section>

        <div class="stack">
            <section class="panel">
                <h2 class="panel-title">Agent 事件</h2>
                <div id="event-list">
                    <div class="event">
                        <div class="event-name">等待任务</div>
                        <div class="event-value">点击“开始执行”后，这里显示 round、工具和记忆事件。</div>
                    </div>
                </div>
            </section>
            <section class="panel">
                <h2 class="panel-title">最终结果</h2>
                <pre id="final-result">尚无结果</pre>
            </section>
            <section class="panel">
                <h2 class="panel-title">MCP Server</h2>
                <div class="actions">
                    <button id="refresh-mcp" class="secondary" type="button">刷新列表</button>
                    <button id="apply-mcp" class="secondary" type="button">启动选中项</button>
                </div>
                <div id="mcp-list">正在读取 MCP Server 配置……</div>
            </section>
        </div>
    </div>
</main>

<script>
    const taskForm = document.getElementById("agent-task-form");
    const startAgentButton = document.getElementById("start-agent");
    const runStatus = document.getElementById("run-status");
    const eventList = document.getElementById("event-list");
    const finalResult = document.getElementById("final-result");
    const mcpList = document.getElementById("mcp-list");
    let backgroundEventSource = null;
    let configuredMCPServers = [];

    const savedWorkingDirectory = localStorage.getItem("ccAgentWorkingDirectory");
    if (savedWorkingDirectory) {
        document.getElementById("working-directory").value = savedWorkingDirectory;
    }

    taskForm.addEventListener("submit", async (browserSubmitEvent) => {
        browserSubmitEvent.preventDefault();
        if (startAgentButton.disabled) return;

        const workingDirectory = document.getElementById("working-directory").value.trim();
        const conversationId = document.getElementById("conversation-id").value.trim();
        const message = document.getElementById("task-message").value.trim();
        localStorage.setItem("ccAgentWorkingDirectory", workingDirectory);
        eventList.replaceChildren();
        finalResult.textContent = "正在执行……";
        setRunStatus("running", "Agent.Run 正在执行");
        startAgentButton.disabled = true;
        startAgentButton.textContent = "执行中";
        openBackgroundEvents(conversationId);

        try {
            const streamResponse = await fetch("/api/chat/stream", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({workingDirectory, conversationId, message})
            });
            if (!streamResponse.body) throw new Error("响应没有 SSE 数据流");

            const streamReader = streamResponse.body.getReader();
            const textDecoder = new TextDecoder("utf-8");
            let undecodedText = "";
            while (true) {
                const {value, done} = await streamReader.read();
                undecodedText += textDecoder.decode(value || new Uint8Array(), {stream: !done});
                const sseFrames = undecodedText.split("\n\n");
                undecodedText = sseFrames.pop() || "";
                for (const sseFrame of sseFrames) {
                    const dataLine = sseFrame.split("\n").find(line => line.startsWith("data: "));
                    if (!dataLine) continue;
                    receiveAgentEvent(JSON.parse(dataLine.slice(6)));
                }
                if (done) break;
            }
        } catch (runError) {
            setRunStatus("failed", runError.message);
            appendEvent("browser_error", runError.message);
        } finally {
            startAgentButton.disabled = false;
            startAgentButton.textContent = "开始执行";
        }
    });

    function receiveAgentEvent(agentEvent) {
        const eventType = agentEvent.type || "unknown";
        if (eventType === "text_delta") return;
        if (eventType === "done" || eventType === "agent_completed") {
            finalResult.textContent = agentEvent.text || "";
            setRunStatus("completed", "Agent.Run 已完成");
        } else if (eventType === "error") {
            setRunStatus("failed", `${agentEvent.code}: ${agentEvent.message}`);
        }
        appendEvent(eventType, JSON.stringify(agentEvent, null, 2));
    }

    function appendEvent(eventName, eventValue) {
        const eventRow = document.createElement("div");
        eventRow.className = "event";
        const nameElement = document.createElement("div");
        nameElement.className = "event-name";
        nameElement.textContent = eventName;
        const valueElement = document.createElement("div");
        valueElement.className = "event-value";
        valueElement.textContent = eventValue;
        eventRow.append(nameElement, valueElement);
        eventList.append(eventRow);
        eventList.scrollTop = eventList.scrollHeight;
    }

    function setRunStatus(statusName, statusText) {
        runStatus.className = `status ${statusName}`;
        runStatus.textContent = statusText;
    }

    function openBackgroundEvents(conversationId) {
        if (backgroundEventSource) backgroundEventSource.close();
        backgroundEventSource = new EventSource(
            `/api/conversations/${encodeURIComponent(conversationId)}/events`
        );
        backgroundEventSource.onmessage = (browserMessageEvent) => {
            receiveAgentEvent(JSON.parse(browserMessageEvent.data));
        };
    }

    async function loadMCPServers() {
        try {
            const response = await fetch("/api/mcp/servers");
            const returnedServers = await response.json();
            configuredMCPServers = returnedServers.servers || returnedServers;
            renderMCPServers();
        } catch (loadError) {
            mcpList.textContent = `读取失败：${loadError.message}`;
        }
    }

    function renderMCPServers() {
        mcpList.replaceChildren();
        for (const configuredServer of configuredMCPServers) {
            const serverRow = document.createElement("label");
            serverRow.className = "mcp-row";
            const serverIdentity = document.createElement("span");
            serverIdentity.innerHTML =
                `<span class="mcp-name"></span><br><span class="mcp-state"></span>`;
            serverIdentity.querySelector(".mcp-name").textContent = configuredServer.name;
            serverIdentity.querySelector(".mcp-state").textContent =
                configuredServer.status || (configuredServer.running ? "running" : "stopped");
            const selection = document.createElement("input");
            selection.type = "checkbox";
            selection.value = configuredServer.name;
            selection.checked = configuredServer.status === "running" || configuredServer.running;
            selection.style.width = "auto";
            serverRow.append(serverIdentity, selection);
            mcpList.append(serverRow);
        }
        if (!configuredMCPServers.length) mcpList.textContent = "没有配置 MCP Server";
    }

    document.getElementById("refresh-mcp").addEventListener("click", loadMCPServers);
    document.getElementById("apply-mcp").addEventListener("click", async () => {
        const selectedMCPServerNames = [...mcpList.querySelectorAll("input:checked")]
            .map(selection => selection.value);
        const response = await fetch("/api/mcp/servers", {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({selectedServerNames: selectedMCPServerNames})
        });
        if (!response.ok) {
            const returnedError = await response.json();
            appendEvent("mcp_error", JSON.stringify(returnedError, null, 2));
        }
        await loadMCPServers();
    });

    loadMCPServers();
</script>
</body>
</html>
