<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐺 狼人杀 - 最终决战沉浸终端</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for standard UI elements -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 导入暗黑哥特风英文字体，强化恐怖迷雾氛围 */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans SC', 'Cinzel', serif;
            background: radial-gradient(circle at center, #1a101f 0%, #0d0612 70%, #030105 100%);
            overflow-x: hidden;
        }

        /* 迷雾和狼嚎背景特效 */
        .mist-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
            overflow: hidden;
        }

        .mist-layer {
            position: absolute;
            width: 200%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><path d="M0,200 Q250,100 500,200 T1000,200 L1000,400 L0,400 Z" fill="%236b21a8"/></svg>') repeat-x;
            background-size: 50% 100%;
            animation: moveMist 40s linear infinite;
        }

        .mist-layer-reverse {
            position: absolute;
            width: 200%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><path d="M0,250 Q250,150 500,250 T1000,250 L1000,400 L0,400 Z" fill="%233b0764"/></svg>') repeat-x;
            background-size: 50% 100%;
            animation: moveMistReverse 25s linear infinite;
            opacity: 0.7;
        }

        @keyframes moveMist {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes moveMistReverse {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        /* 呼吸发光特效 */
        .glowing-red {
            animation: glowRed 2s ease-in-out infinite;
        }
        .glowing-gold {
            animation: glowGold 2s ease-in-out infinite;
        }
        .pulse-input {
            animation: pulseInput 1.5s infinite;
        }

        @keyframes glowRed {
            0%, 100% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); border-color: rgba(239, 68, 68, 1); }
        }

        @keyframes glowGold {
            0%, 100% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 18px rgba(245, 158, 11, 0.7); border-color: rgba(245, 158, 11, 1); }
        }

        @keyframes pulseInput {
            0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(168, 85, 247, 0); }
            100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 11, 22, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(107, 33, 168, 0.5);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(147, 51, 234, 0.8);
        }

        /* 气泡消息动效 */
        .msg-fade-in {
            animation: msgSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes msgSlideIn {
            0% { opacity: 0; transform: translateY(12px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 系统横幅入场 */
        .banner-pop {
            animation: bannerPopIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes bannerPopIn {
            0% { opacity: 0; transform: scale(0.8) translateY(-30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 拟物死亡碎裂效果 */
        .death-shatter {
            position: relative;
            filter: grayscale(100%);
            transition: all 0.5s ease-in-out;
        }
        .death-shatter::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(1px);
            z-index: 10;
        }

        /* AI 输入状态小圆点 */
        .typing-dot {
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col relative select-none">

    <!-- 迷雾背景 -->
    <div class="mist-container">
        <div class="mist-layer"></div>
        <div class="mist-layer-reverse" style="top: 200px;"></div>
    </div>

    <!-- 顶部状态栏 -->
    <header class="relative z-10 border-b border-purple-900/40 bg-slate-950/85 backdrop-blur-md px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- 标志 & 房间状态 -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-red-600 to-purple-800 flex items-center justify-center shadow-md border border-purple-500/30">
                    <span class="text-xl">🐺</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider bg-gradient-to-r from-red-500 via-purple-400 to-amber-400 bg-clip-text text-transparent" style="font-family: 'Cinzel', serif;">
                        WEREWOLF TERMINAL
                    </h1>
                    <div class="flex items-center gap-2 text-xs text-slate-400">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="connection-dot"></span>
                        <span id="connection-status">等待启动</span>
                        <span class="text-slate-600">|</span>
                        <span>8人暗牌局</span>
                    </div>
                </div>
            </div>

            <!-- 当前阶段指示器 (核心需求 2) -->
            <div class="flex items-center gap-3 bg-slate-900/90 border border-purple-500/20 px-4 py-2 rounded-xl shadow-inner w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-purple-400 font-bold uppercase tracking-widest">当前阶段</span>
                    <div id="current-phase-badge" class="px-3 py-1 rounded-lg text-sm font-bold bg-purple-950/80 border border-purple-500/40 text-purple-300 flex items-center gap-1.5">
                        <span>💤 准备就绪</span>
                    </div>
                </div>
                <div class="text-right border-l border-purple-900/50 pl-3">
                    <div class="text-xs text-slate-400">游戏轮数</div>
                    <div id="current-round" class="text-lg font-black text-amber-400">第 0 轮</div>
                </div>
            </div>

            <!-- 控制与模式切换 -->
            <div class="flex items-center gap-2.5 w-full md:w-auto justify-end">
                <!-- 模拟引擎切换器（极大地方便在无后端时预览全部流程） -->
                <div class="flex items-center bg-slate-900 border border-slate-800 rounded-lg p-1 text-xs">
                    <button id="btn-mode-api" onclick="setMode('api')" class="px-2.5 py-1 rounded md:transition-all font-medium bg-red-600 text-white">
                        🔌 真实 API
                    </button>
                    <button id="btn-mode-demo" onclick="setMode('demo')" class="px-2.5 py-1 rounded md:transition-all font-medium text-slate-400">
                        🎬 本地 DEMO
                    </button>
                </div>

                <!-- 启动按钮 -->
                <button id="btn-start-game" onclick="startGame()" class="px-5 py-2 rounded-xl bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-600 hover:to-indigo-600 border border-purple-400/30 font-bold text-sm tracking-widest shadow-lg shadow-purple-900/40 hover:shadow-purple-500/20 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-play"></i> 开始游戏
                </button>
                <button id="btn-reset-game" onclick="resetGame()" class="hidden px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold transition-all">
                    重置
                </button>
            </div>
        </div>
    </header>

    <!-- 游戏主舞台区 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 md:p-4 grid grid-cols-1 lg:grid-cols-4 gap-4 relative z-10 overflow-hidden">
        
        <!-- 侧边栏：玩家列表区 (需求 4) -->
        <section class="lg:col-span-1 bg-slate-950/75 border border-purple-950/60 rounded-2xl p-3 backdrop-blur-md flex flex-col gap-3 shadow-xl h-[320px] lg:h-auto min-h-0">
            <div class="flex items-center justify-between border-b border-purple-900/30 pb-2">
                <h2 class="text-sm font-bold tracking-wider text-purple-300 flex items-center gap-2">
                    <i class="fa-solid fa-users"></i> 存活状态 (8人局)
                </h2>
                <span id="player-alive-count" class="text-xs bg-purple-900/50 text-purple-200 px-2 py-0.5 rounded-full border border-purple-500/20">8/8 存活</span>
            </div>

            <!-- 玩家列表 -->
            <div id="player-grid" class="flex-1 overflow-y-auto grid grid-cols-2 lg:grid-cols-1 gap-2 pr-1">
                <!-- 动态生成 8 位玩家 -->
            </div>
        </section>

        <!-- 主屏幕：公告和发言区 (需求 3) -->
        <section class="lg:col-span-3 flex flex-col bg-slate-950/75 border border-purple-950/60 rounded-2xl backdrop-blur-md shadow-xl overflow-hidden min-h-[400px] h-[55vh] lg:h-auto">
            
            <!-- 提示玩家角色的信息条 -->
            <div id="role-alert-bar" class="hidden px-4 py-2 bg-gradient-to-r from-purple-900/50 via-slate-900/80 to-purple-900/50 border-b border-purple-800/40 text-xs flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-amber-400">✨ 身份揭示:</span>
                    <span id="role-text" class="font-bold text-purple-300">未知角色</span>
                </div>
                <div class="flex items-center gap-2">
                    <span>阵营:</span>
                    <span id="team-text" class="font-bold">未知阵营</span>
                </div>
            </div>

            <!-- 系统公告置顶显示区 -->
            <div id="announce-box" class="hidden px-4 py-3 bg-red-950/40 border-b border-red-900/30 text-center animate-pulse">
                <div class="text-xs text-red-400 font-bold uppercase tracking-wider mb-1"><i class="fa-solid fa-circle-exclamation"></i> 紧急局势公告</div>
                <p id="announce-text" class="text-sm font-black text-white"></p>
            </div>

            <!-- 消息历史视窗 -->
            <div id="message-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
                <!-- 欢迎/引导消息 -->
                <div class="text-center py-8 px-4 text-slate-500 max-w-md mx-auto">
                    <i class="fa-solid fa-skull-crossbones text-4xl text-purple-900/50 mb-3 animate-bounce"></i>
                    <h3 class="text-sm font-bold text-slate-400 mb-1">黑森林深处的古老密林</h3>
                    <p class="text-xs leading-relaxed">欢迎来到狼人杀智能推理对战终端。请选择「本地 DEMO」进行单机运行体验，或点击右上角「开始游戏」与 AI 后端联机。</p>
                </div>
            </div>

            <!-- 底部：人类发言输入交互区 (需求 5) -->
            <div class="p-3 bg-slate-900/60 border-t border-purple-900/30">
                <!-- 输入框上方的状态和提示信息 -->
                <div class="flex items-center justify-between mb-2">
                    <div id="prompt-status-indicator" class="flex items-center gap-1.5 text-xs text-slate-400">
                        <span class="inline-block w-2.5 h-2.5 rounded-full bg-slate-600" id="prompt-light"></span>
                        <span id="prompt-message" class="font-medium">等待其他玩家行动中...</span>
                    </div>
                    <span id="char-counter" class="text-[10px] text-slate-500">0/150 字</span>
                </div>

                <!-- 输入发送区域 -->
                <form id="input-form" onsubmit="handleSendInput(event)" class="flex gap-2">
                    <div class="relative flex-1">
                        <input id="chat-input" type="text" disabled maxlength="150" oninput="updateCharCount()"
                               class="w-full bg-slate-950/90 border border-slate-800 disabled:bg-slate-900/40 disabled:text-slate-500 disabled:border-slate-900 text-slate-100 placeholder-slate-600 px-4 py-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600/50 transition-all"
                               placeholder="等待发言时段解锁...">
                        <div id="lock-overlay-icon" class="absolute right-3.5 top-3 text-slate-600">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                    </div>
                    <button id="btn-send" type="submit" disabled
                            class="px-5 py-3 rounded-xl bg-purple-800 disabled:bg-slate-900 disabled:text-slate-600 disabled:border-slate-900 hover:bg-purple-700 text-white font-bold text-sm tracking-wider border border-purple-600/40 hover:border-purple-400/40 transition-all flex items-center gap-1.5 shadow-lg">
                        <i class="fa-solid fa-paper-plane text-xs"></i> <span>发送</span>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- 弹窗/全局覆层：大卡片揭晓 (需求 6) -->
    <div id="reveal-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
        <div class="bg-slate-950 border-2 border-amber-500/40 max-w-xl w-full rounded-2xl p-6 shadow-2xl relative overflow-hidden flex flex-col gap-5 banner-pop">
            <!-- 氛围花纹背景 -->
            <div class="absolute -right-16 -top-16 text-[180px] text-slate-900/30 font-black select-none pointer-events-none">💡</div>

            <div class="text-center border-b border-amber-500/20 pb-3">
                <span class="text-[40px]">🔮</span>
                <h3 class="text-xl font-bold tracking-widest text-amber-400 mt-2">星象窥视 - 局后身份大揭秘</h3>
                <p class="text-xs text-slate-400 mt-1">天亮了，一切伪装在光明中消融</p>
            </div>

            <!-- 所有角色的揭晓列表 -->
            <div id="reveal-list" class="grid grid-cols-2 gap-3 max-h-[350px] overflow-y-auto pr-1">
                <!-- 动态填入揭秘信息 -->
            </div>

            <!-- 控制区域 -->
            <div class="flex justify-center gap-3 border-t border-slate-900 pt-4">
                <button onclick="closeRevealOverlay()" class="px-5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 text-sm border border-slate-800 transition-all">
                    查看战场记录
                </button>
                <button onclick="resetGameAndStart()" class="px-5 py-2 rounded-xl bg-gradient-to-r from-amber-600 to-red-700 text-white text-sm font-bold border border-amber-500/30 shadow-lg shadow-red-950/50 transition-all">
                    再来一局
                </button>
            </div>
        </div>
    </div>

    <!-- Toast 浮动通知器 -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2"></div>

        };

        // 阶段映射表（需求 2）
        const phaseMapping = {
            'intro': { text: "💬 自我介绍", bg: "bg-teal-950/80 border-teal-500/40 text-teal-300" },

        // 初始化
        window.onload = function() {

        // 切换模式

        // 绘制玩家列表 (需求 4)
        function renderPlayers() {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = '';
            
            players.forEach(p => {
                const isSpeaking = activeSpeakers.has(p.roleName);
                const borderClass = p.isHuman

                        <!-- 详情 -->

                                <!-- AI正在输入动画 -->

                                    <span class="w-1.5 h-1.5 bg-purple-400 rounded-full typing-dot"></span>
                                    <span class="w-1.5 h-1.5 bg-purple-400 rounded-full typing-dot"></span>

        // 修改特定角色发言动画
        function setSpeakerState(roleName, isSpeaking) {
            const player = players.find(p => p.roleName === roleName);
            if (!player) return;
            if (isSpeaking) {
                activeSpeakers.add(roleName);
            } else {
                activeSpeakers.delete(roleName);
            }
            renderPlayers();
        }

        // 修改玩家生命值
        function setPlayerStatus(roleName, alive) {
            const player = players.find(p => p.roleName === roleName);
            if (player) {
                player.alive = alive;
                if (player.isHuman && !alive) {
                    isDead = true;
                }
            }
            renderPlayers();
        }

        // 统一控制连接状态指示
        function setConnection(statusText, colorClass, dotAnimation = true) {
            const dot = document.getElementById('connection-dot');
            const label = document.getElementById('connection-status');
            
            label.innerText = statusText;
            dot.className = `inline-block w-2.5 h-2.5 rounded-full ${colorClass} ${dotAnimation ? 'animate-pulse' : ''}`;
        }

        // ==============================
        // 核心功能：游戏控制与流接入
        // ==============================
        
        async function startGame() {
            if (isGameRunning) return;
            
            // 清理状态
            isGameRunning = true;
            document.getElementById('btn-start-game').disabled = true;
            document.getElementById('btn-start-game').classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('btn-reset-game').classList.remove('hidden');
            
            players = JSON.parse(JSON.stringify(playersTemplate));
            activeSpeakers.clear();
            isDead = false;
            currentRound = 0;
            renderPlayers();

            document.getElementById('message-container').innerHTML = `
                <div class="text-center py-4 text-purple-400 font-bold text-xs tracking-wider animate-pulse">
                    🔮 诸神夜空笼罩，命运之轮已开始转动...
                </div>
            `;

            if (mode === 'api') {
                connectToRealBackend();
            } else {
                runDemoSimulation();
            }
        }

        // 对接真实 API (使用手动 fetch+ReadableStream 以解决传统 EventSource 对 POST 或特定端点参数的不兼容)
        async function connectToRealBackend() {
            setConnection("正在开启暗黑仪式...", "bg-amber-500");
            try {
                const response = await fetch('/api/werewolf/stream');
                if (!response.ok) throw new Error(`服务端异常: ${response.status}`);
                
                setConnection("灵能链接正常", "bg-emerald-500");
                const readerObj = response.body.getReader();
                reader = readerObj;
                const decoder = new TextDecoder("utf-8");
                let partialLine = "";

                while (isGameRunning) {
                    const { value, done } = await readerObj.read();
                    if (done) break;
                    
                    partialLine += decoder.decode(value, { stream: true });
                    const lines = partialLine.split("\n");
                    partialLine = lines.pop(); // 保留不完整分片

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed) continue;
                        
                        // 标准 SSE 处理
                        if (trimmed.startsWith("data:")) {
                            const rawJson = trimmed.slice(5).trim();
                            try {
                                const frame = JSON.parse(rawJson);
                                handleIncomingFrame(frame);
                            } catch (e) {
                                console.error("解析帧JSON失败:", e, rawJson);
                            }
                        } else {
                            // 兼容直接流式输出原始 JSON 格式
                            try {
                                const frame = JSON.parse(trimmed);
                                handleIncomingFrame(frame);
                            } catch (e) {
                                // 忽略噪音或说明文本
                            }
                        }
                    }
                }
            } catch (err) {
                showToast("🔮 仪式中断: " + err.message);
                setConnection("仪式中断", "bg-red-500", false);
                isGameRunning = false;
                document.getElementById('btn-start-game').disabled = false;
                document.getElementById('btn-start-game').classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // ==============================
        // 核心协议处理器 (SSE 帧类型一览)
        // ==============================
        
        function handleIncomingFrame(frame) {
            if (!frame || !frame.type) return;

            switch (frame.type) {
                case 'role':
                    // 告知人类玩家自己的身份和阵营
                    myRole = frame.role;
                    myTeam = frame.team;
                    
                    // 将我（8号）的身份卡更新为具体角色
                    const me = players.find(p => p.isHuman);
                    if (me) {
                        me.roleName = myRole;
                        me.roleKey = getRoleKeyByName(myRole);
                        me.avatar = me.roleKey;
                    }
                    renderPlayers();

                    // 显示在顶部醒目的身份提示栏
                    const alertBar = document.getElementById('role-alert-bar');
                    alertBar.classList.remove('hidden');
                    document.getElementById('role-text').innerText = myRole;
                    document.getElementById('team-text').innerText = myTeam === 'wolves' ? '🐺 狼人阵营' : '🛡️ 好人阵营';
                    document.getElementById('team-text').className = `font-bold ${myTeam === 'wolves' ? 'text-red-500' : 'text-emerald-400'}`;
                    
                    pushSystemMsg(`🎭 契约缔结！你本局的真实身份为【${myRole}】，所属【${myTeam === 'wolves' ? '狼人阵营' : '好人阵营'}】。`);
                    break;

                case 'phase':
                    // 阶段更新
                    updatePhaseDisplay(frame.phase, frame.round);
                    break;

                case 'announce':
                    // 全局系统大公告
                    showFullScreenAnnounce(frame.text);
                    break;

                case 'speech':
                    // 角色发言
                    handleSpeechFrame(frame);
                    break;

                case 'prompt':
                    // 轮到人类行动
                    unlockInputForPrompt(frame.phase, frame.message);
                    break;

                case 'reveal':
                    // 局终身份大揭秘
                    showRevealOverlay(frame.text);
                    break;

                case 'done':
                    // 游戏结束
                    concludeGame(frame.winner);
                    break;

                case 'error':
                    // 系统错误提示
                    showToast("⚠️ " + frame.message);
                    break;
            }
        }

        // 根据中文名转换为 Key 获得图标
        function getRoleKeyByName(name) {
            if (name.includes("狼人")) return "wolf";
            if (name.includes("预言家")) return "seer";
            if (name.includes("女巫")) return "witch";
            if (name.includes("猎人")) return "hunter";
            return "villager";
        }

        // 更新顶部和右侧状态指标 (需求 2)
        function updatePhaseDisplay(phase, round) {
            if (round !== undefined) {
                currentRound = round;
                document.getElementById('current-round').innerText = `第 ${round} 轮`;
            }
            
            const badge = document.getElementById('current-phase-badge');
            const mapping = phaseMapping[phase] || { text: phase, bg: "bg-slate-900 border-slate-700 text-slate-300" };
            
            // 是否为黑夜
            const isNight = phase.startsWith('night_');
            badge.className = `px-3 py-1 rounded-lg text-sm font-bold flex items-center gap-1.5 border ${mapping.bg} glowing-red`;
            badge.innerHTML = `<span>${isNight ? '🌙 夜晚' : mapping.text}</span>`;

            pushSystemMsg(`📍 阶段转换：当前转入【${mapping.text}】`);
        }

        // 处理天亮、投票结果等高亮系统公告
        function showFullScreenAnnounce(text) {
            const box = document.getElementById('announce-box');
            const announceText = document.getElementById('announce-text');
            
            box.classList.remove('hidden');
            box.className = "px-4 py-3 bg-red-950/65 border-b border-red-500/30 text-center animate-bounce shadow-inner";
            announceText.innerText = text;

            // 语音或视觉增强
            pushSystemMsg(`📢 公告: ${text}`, "system");

            // 检测公告内的出局人员，动态同步死亡状态
            // 举例：昨晚平民A被杀、3号预言家被放逐
            players.forEach(p => {
                if (text.includes(p.roleName) && (text.includes("死") || text.includes("杀") || text.includes("放逐") || text.includes("出局"))) {
                    setPlayerStatus(p.roleName, false);
                }
            });
        }

        // 处理玩家说话帧
        function handleSpeechFrame(frame) {
            const from = frame.from;
            const text = frame.text;
            const visibleTo = frame.visibleTo; // 非 null 代表私密消息

            // 边界条件：如果当前玩家不在可见列表里，则不予显示
            if (visibleTo && visibleTo.length > 0) {
                const myCurrentRoleName = players.find(p => p.isHuman)?.roleName;
                if (!visibleTo.includes(myCurrentRoleName)) {
                    // 本人不在此私密名单中，平民看不到狼人夜间密谋，完美拦截
                    return;
                }
            }

            // 开启动画
            setSpeakerState(from, true);
            
            setTimeout(() => {
                // 关闭对应说话状态
                setSpeakerState(from, false);
                
                // 绘制消息
                const container = document.getElementById('message-container');
                const isMe = from === players.find(p => p.isHuman)?.roleName;
                
                let cardHtml = '';
                const speakerObj = players.find(p => p.roleName === from) || { avatar: 'system' };
                const avatarSvg = avatars[speakerObj.avatar] || avatars.villager;

                // 判断是否是私密
                const isPrivate = visibleTo && visibleTo.length > 0;
                const bubbleBg = isMe 
                    ? 'bg-gradient-to-br from-purple-900 to-indigo-950 border-purple-500/50 text-indigo-100 shadow-purple-950/50' 
                    : (isPrivate 
                        ? 'bg-slate-900/90 border-slate-700/60 text-slate-400 opacity-80 backdrop-blur-sm' 
                        : 'bg-slate-900 border-slate-800 text-slate-200 shadow-slate-950/40');

                if (isMe) {
                    // 自己右边靠齐
                    cardHtml = `
                        <div class="flex items-start justify-end gap-3 msg-fade-in">
                            <div class="flex flex-col items-end max-w-[70%]">
                                <span class="text-[10px] text-slate-500 mb-1">你 (${from})</span>
                                <div class="px-3.5 py-2.5 rounded-2xl rounded-tr-none text-sm border ${bubbleBg} leading-relaxed">
                                    ${text}
                                </div>
                            </div>
                            <div class="flex-shrink-0">
                                ${avatarSvg}
                            </div>
                        </div>
                    `;
                } else {
                    // 别人左边靠齐
                    cardHtml = `
                        <div class="flex items-start gap-3 msg-fade-in">
                            <div class="flex-shrink-0">
                                ${avatarSvg}
                            </div>
                            <div class="flex flex-col max-w-[70%]">
                                <span class="text-[10px] text-slate-500 mb-1 flex items-center gap-1.5">
                                    <span>${from}</span>
                                    ${isPrivate ? '<span class="text-[9px] text-red-400 bg-red-950/30 px-1 border border-red-900/30 rounded flex items-center gap-0.5">🔒 仅特定角色</span>' : ''}
                                </span>
                                <div class="px-3.5 py-2.5 rounded-2xl rounded-tl-none text-sm border ${bubbleBg} leading-relaxed relative">
                                    ${text}
                                </div>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML += cardHtml;
                container.scrollTop = container.scrollHeight;
            }, 600); // 预留一小段模拟延迟打字感
        }

        // 全局通用消息推送
        function pushSystemMsg(text, type = "normal") {
            const container = document.getElementById('message-container');
            let color = "text-amber-400/80";
            if (type === "system") color = "text-red-400 font-extrabold";
            
            container.innerHTML += `
                <div class="text-center py-1 px-4 msg-fade-in">
                    <span class="inline-block text-[11px] px-3 py-1 rounded-full bg-slate-950/50 border border-slate-900 ${color}">
                        ${text}
                    </span>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        // ==============================
        // 解锁人类输入行动交互 (需求 5)
        // ==============================
        
        function unlockInputForPrompt(phase, message) {
            promptPhase = phase;
            
            const input = document.getElementById('chat-input');
            const btn = document.getElementById('btn-send');
            const overlayIcon = document.getElementById('lock-overlay-icon');
            const promptLight = document.getElementById('prompt-light');
            const promptText = document.getElementById('prompt-message');

            // 边界：检测本人是否存活，若已死则不可交互并跳过输入
            if (isDead) {
                promptLight.className = "inline-block w-2.5 h-2.5 rounded-full bg-red-600 animate-pulse";
                promptText.innerText = "✝️ 你已在漫漫黑夜中阵亡，请尊重规则闭眼倾听...";
                return;
            }

            // 解锁
            input.disabled = false;
            btn.disabled = false;
            overlayIcon.innerHTML = `<i class="fa-solid fa-unlock text-amber-400 animate-bounce"></i>`;
            
            promptLight.className = "inline-block w-2.5 h-2.5 rounded-full bg-purple-500 animate-ping";
            promptText.innerText = `${message} (请立即做出抉择)`;
            promptText.className = "font-extrabold text-purple-300";
            
            input.placeholder = `输入你要在【${phaseMapping[phase]?.text || phase}】阶段的发言或选号...`;
            input.classList.add('glowing-gold');
            input.focus();
        }

        // 输入锁定
        function lockInput() {
            const input = document.getElementById('chat-input');
            const btn = document.getElementById('btn-send');
            const overlayIcon = document.getElementById('lock-overlay-icon');
            const promptLight = document.getElementById('prompt-light');
            const promptText = document.getElementById('prompt-message');

            input.disabled = true;
            btn.disabled = true;
            input.placeholder = "等待发言时段解锁...";
            input.classList.remove('glowing-gold');
            overlayIcon.innerHTML = `<i class="fa-solid fa-lock text-slate-600"></i>`;
            promptLight.className = "inline-block w-2.5 h-2.5 rounded-full bg-slate-600";
            promptText.className = "font-medium text-slate-400";
            promptText.innerText = "等待其他玩家行动中...";
        }

        // 发送发言或选票
        async function handleSendInput(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            // 记录人类发言
            const myRoleName = players.find(p => p.isHuman)?.roleName || "平民C";
            
            // 立即锁定避免重复提交
            lockInput();

            // 构造拟态广播(如果是在Demo模式)
            if (mode === 'demo') {
                simulateHumanSpeechResponse(myRoleName, text);
            } else {
                // 发送真实 POST 请求
                try {
                    const response = await fetch('/api/werewolf/input', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });
                    if (!response.ok) throw new Error("向神明祈愿失败");
                    showToast("🍀 行动传达成功");
                } catch (err) {
                    showToast("❌ 发送失败: " + err.message);
                    // 失败了重新恢复解锁状态
                    unlockInputForPrompt(promptPhase, "发生故障，请重新决策！");
                }
            }

            input.value = '';
            updateCharCount();
        }

        // 字数计数
        function updateCharCount() {
            const len = document.getElementById('chat-input').value.length;
            document.getElementById('char-counter').innerText = `${len}/150 字`;
        }

        // ==============================
        // 游戏终局及揭秘结算显示 (需求 6)
        // ==============================
        
        function showRevealOverlay(revealText) {
            const overlay = document.getElementById('reveal-overlay');
            const list = document.getElementById('reveal-list');
            list.innerHTML = '';
            overlay.classList.remove('hidden');

            // 示例揭晓格式：玩家1(狼人A)、玩家2(平民B)
            // 如果后端直接返回一段文本，前端漂亮地按行解构
            const lines = revealText.split("\n");
            lines.forEach((line, index) => {
                if (!line.trim()) return;
                
                let icon = '🛡️';
                let cardColor = 'border-slate-800 bg-slate-900';
                if (line.includes("狼")) {
                    icon = '🐺';
                    cardColor = 'border-red-900/30 bg-red-950/20 text-red-200';
                } else if (line.includes("预言")) {
                    icon = '🔮';
                    cardColor = 'border-amber-900/30 bg-amber-950/20 text-amber-200';
                } else if (line.includes("女巫")) {
                    icon = '🧪';
                    cardColor = 'border-fuchsia-900/30 bg-fuchsia-950/20 text-fuchsia-200';
                } else if (line.includes("猎人")) {
                    icon = '🎯';
                    cardColor = 'border-emerald-900/30 bg-emerald-950/20 text-emerald-200';
                }

                list.innerHTML += `
                    <div class="border rounded-xl p-3 flex items-center gap-3 ${cardColor} transition-all hover:scale-[1.02] duration-300">
                        <span class="text-xl">${icon}</span>
                        <div>
                            <p class="text-xs font-black text-slate-100">${line}</p>
                            <span class="text-[9px] text-slate-500">序号 ${index + 1}</span>
                        </div>
                    </div>
                `;
            });
        }

        function closeRevealOverlay() {
            document.getElementById('reveal-overlay').classList.add('hidden');
        }

        function concludeGame(winner) {
            isGameRunning = false;
            document.getElementById('btn-start-game').disabled = false;
            document.getElementById('btn-start-game').classList.remove('opacity-50', 'cursor-not-allowed');

            const isWolfVictory = winner === 'wolves' || winner === '狼人';
            const winnerText = isWolfVictory ? "🐺 狼人阵营胜利" : "🛡️ 好人阵营胜利";
            
            // 全局大公告
            showFullScreenAnnounce(`🏁 游戏宣告结束！ ${winnerText}`);
            updatePhaseDisplay('end');

            pushSystemMsg(`🏆 最终结果：【${winnerText}】！`, "system");
        }

        // 重置游戏
        function resetGame() {
            isGameRunning = false;
            if (reader) {
                try { reader.cancel(); } catch(e){}
            }
            document.getElementById('btn-start-game').disabled = false;
            document.getElementById('btn-start-game').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('btn-reset-game').classList.add('hidden');
            document.getElementById('role-alert-bar').classList.add('hidden');
            document.getElementById('announce-box').classList.add('hidden');
            lockInput();
            
            players = JSON.parse(JSON.stringify(playersTemplate));
            activeSpeakers.clear();
            isDead = false;
            currentRound = 0;
            renderPlayers();

            document.getElementById('message-container').innerHTML = `
                <div class="text-center py-8 text-slate-500">
                    <p class="text-xs">游戏重置完毕，等待下一局迷雾消散。</p>
                </div>
            `;
            showToast("🌀 宿命回溯，战场已重置");
        }

        function resetGameAndStart() {
            closeRevealOverlay();
            resetGame();
            setTimeout(() => {
                startGame();
            }, 500);
        }

        // 通用 Toast 提示
        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "px-4 py-3 bg-slate-900/95 border-l-4 border-purple-500 text-slate-200 text-xs rounded-lg shadow-xl flex items-center gap-2 animate-bounce";
            toast.innerHTML = `
                <i class="fa-solid fa-circle-info text-purple-400"></i>
                <span>${msg}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-all', 'duration-500');
                setTimeout(() => toast.remove(), 500);
            }, 3500);
        }


        // ==============================================================
        // 核心技术彩蛋：高拟真本地模拟引擎（Demo 模拟运行机制）
        // ==============================================================
        
        let demoTimer = null;
        let demoStepIndex = 0;

        function runDemoSimulation() {
            demoStepIndex = 0;
            setConnection("模拟流对接就绪 (演示)", "bg-emerald-500");
            
            const demoFrames = [
                // 1. 角色分发
                { type: 'role', role: '预言家', team: 'villagers', phase: 'intro' },
                { type: 'phase', phase: 'intro', round: 1 },
                
                // 2. 自我介绍
                { type: 'speech', from: '狼人A', text: '大家好我是1号玛丽雅，本局想拿好人牌，希望狼人手下留情。', visibleTo: null },
                { type: 'speech', from: '狼人B', text: '我是2号莱昂，是个安分守己的好平民，跟着大队走。', visibleTo: null },
                { type: 'speech', from: '3号弗里茨', text: '大家好我是预言家，今晚我必须查验一个人，大家等我消息。', visibleTo: null },
                { type: 'speech', from: '女巫', text: '4号塞拉，本局掌握生杀大权，大家发言小心。', visibleTo: null },
                
                // 3. 轮到人类(预言家)进行自我介绍
                { type: 'prompt', phase: 'intro', message: '轮到你进行自我介绍了，请给全场好人打个招呼' },
                
                // (此处等待人类完成发送，人类发送完后会触发下一批帧)
            ];

            executeDemoStep(demoFrames);
        }

        function executeDemoStep(frames) {
            if (!isGameRunning || mode !== 'demo') return;
            if (demoStepIndex >= frames.length) return;

            const frame = frames[demoStepIndex];
            handleIncomingFrame(frame);
            demoStepIndex++;

            if (frame.type !== 'prompt') {
                demoTimer = setTimeout(() => {
                    executeDemoStep(frames);
                }, 2200); // 间隔仿真速度
            }
        }

        // 人类在 Demo 模式下发言后的反应仿真
        function simulateHumanSpeechResponse(humanName, text) {
            // 首先本地显示我刚才说的话
            handleIncomingFrame({
                type: 'speech',
                from: humanName,
                text: text,
                visibleTo: null
            });

            // 1秒后，模拟转场到第一夜狼人行凶
            setTimeout(() => {
                pushSystemMsg("🌒 黑夜降临... 所有好人闭眼，狼人请睁眼...");
                
                const nightFrames = [
                    { type: 'phase', phase: 'night_wolves', round: 1 },
                    // 模拟狼人夜私聊(对好人来说是看不见的)
                    // 因为我们扮演的是预言家，不在狼人私聊可见列表，所以这几条信息绝对会被拦截过滤，体现完美边界处理
                    { type: 'speech', from: '狼人A', text: '（私聊）今夜我们杀谁？要不直接闷了3号预言家？', visibleTo: ['狼人A', '狼人B'] },
                    { type: 'speech', from: '狼人B', text: '（私聊）可以，杀3号！', visibleTo: ['狼人A', '狼人B'] },
                    
                    // 转到预言家之夜
                    { type: 'phase', phase: 'night_seer', round: 1 },
                    // 预言家是我，所以我是可见的
                    { type: 'speech', from: '3号弗里茨', text: '（私聊）我要查验1号，直觉告诉我她是狼。', visibleTo: ['预言家'] },
                    { type: 'prompt', phase: 'night_seer', message: '请选择你想查验身份的人员号码 (1-7)' }
                ];
                
                demoStepIndex = 0;
                executeDemoStep(nightFrames);
            }, 2000);
        }

        // 接收到查验指令后，仿真天亮
        function simulateSeerCheckAndDay(targetNo) {
            pushSystemMsg(`🔮 查验报告：你查验了 ${targetNo}号 玛丽雅，她的身份是【狼人】！`, 'system');

            setTimeout(() => {
                const dayFrames = [
                    { type: 'phase', phase: 'day_announce', round: 1 },
                    { type: 'announce', text: '昨晚 3号预言家(3号弗里茨) 惨遭狼人杀害！' },
                    
                    // 白天自由讨论
                    { type: 'phase', phase: 'day_discuss', round: 1 },
                    { type: 'speech', from: '5号 艾伦', text: '天哪，昨晚3号预言家竟然死了！预言家首夜就倒牌了？女巫没开药吗？', visibleTo: null },
                    { type: 'speech', from: '狼人A', text: '我昨晚觉得玛丽雅发言很好，难道这就是报应？3号死得很蹊跷，凶手可能在4号和5号里。', visibleTo: null },
                    
                    // 轮到玩家发表遗言(因为3号死了，但等等，我们扮演的是8号平民C呢？)
                    // 啊，前面我们在 role 里扮演的是 预言家，那 3号 死了就是我们死了。
                    // 让我们触发投票阶段
                    { type: 'phase', phase: 'day_vote', round: 1 },
                    { type: 'prompt', phase: 'day_vote', message: '轮到大家投票，请写下你神圣的放逐一票 (推荐投1号)' }
                ];

                demoStepIndex = 0;
                executeDemoStep(dayFrames);
            }, 3000);
        }

        // 重载发送拦截，让本地 Demo 更加智能化互动
        const originalHandleSend = handleSendInput;
        handleSendInput = function(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            if (mode === 'demo') {
                if (promptPhase === 'night_seer') {
                    // 预言家之夜
                    handleSpeechFrame({
                        type: 'speech',
                        from: '8号 玩家(你)',
                        text: `我决定查验 [${text}] 号玩家！`,
                        visibleTo: ['预言家']
                    });
                    lockInput();
                    setTimeout(() => {
                        simulateSeerCheckAndDay(text);
                    }, 1500);
                    input.value = '';
                    updateCharCount();
                    return;
                } else if (promptPhase === 'day_vote') {
                    // 白天投票
                    handleSpeechFrame({
                        type: 'speech',
                        from: '8号 玩家(你)',
                        text: `我投票给 [${text}] 号，大家跟我一起驱逐狼人！`,
                        visibleTo: null
                    });
                    lockInput();
                    
                    // 模拟投票出局并结束游戏
                    setTimeout(() => {
                        showFullScreenAnnounce(`投票放逐结果：全票通过！1号 玛丽雅 被公投出局！`);
                        setPlayerStatus('1号 玛丽雅', false);
                        
                        setTimeout(() => {
                            // 胜利大揭秘
                            const revealData = "1号 玛丽雅 (狼人A)\n2号 莱昂 (狼人B)\n3号 弗里茨 (预言家)\n4号 塞拉 (女巫)\n5号 艾伦 (猎人)\n6号 汉斯 (平民A)\n7号 艾玛 (平民B)\n8号 玩家(我) (平民C)";
                            handleIncomingFrame({ type: 'reveal', text: revealData });
                            handleIncomingFrame({ type: 'done', winner: 'villagers' });
                        }, 2500);
                    }, 2000);
                    
                    input.value = '';
                    updateCharCount();
                    return;
                }
            }

            // 默认路由
            originalHandleSend(e);
        };
    </script>
</body>
</html>
