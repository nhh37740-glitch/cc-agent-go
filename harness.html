        </div>
        <div class="panel-title">记忆
            <button id="load-memory" class="button small ghost" type="button" disabled>读取</button>
        </div>
        <div id="memory-view" class="memory-view"></div>
    </aside>
</main>
<!-- 动态主题：工作 Agent 全息气泡层 -->
<div class="work-orbit" aria-hidden="true"></div>


<script>
"use strict";

const workingDirectoryInput = document.getElementById("working-directory");
const loadProjectButton = document.getElementById("load-project");
const serverState = document.getElementById("server-state");
const poolSummary = document.getElementById("pool-summary");
const agentList = document.getElementById("agent-list");
const chatHistory = document.getElementById("chat-history");
const chatForm = document.getElementById("chat-form");
const chatInput = document.getElementById("chat-input");
const sendButton = document.getElementById("send-button");
const stopButton = document.getElementById("stop-button");
let activeChatAbortController = null;
const HARNESS_CONVERSATION_ID = "harness";
const detailTitle = document.getElementById("detail-title");
const progressStream = document.getElementById("progress-stream");
const loadMemoryButton = document.getElementById("load-memory");
const memoryView = document.getElementById("memory-view");
const conversationList = document.getElementById("conversation-list");
const refreshConversationsButton = document.getElementById("refresh-conversations");

const BUBBLE_RENDER_INTERVAL_MS = 50;

let activeWorkingDirectory = localStorage.getItem("harnessWorkingDirectory") || "";
workingDirectoryInput.value = activeWorkingDirectory;
let agentsPollTimer = null;
let agentsLoadPending = false;
let agentsLoadQueued = false;
let lastAgentRosterSignature = "";
let harnessEventSource = null;
let progressEventSource = null;
let selectedAgentName = null;
let selectedAgentConversationId = null;
let chatUserNearBottom = true;
let progressUserNearBottom = true;
let chatStreamBubble = null;
let backgroundBubble = null;
let progressRawText = "";
let progressPendingText = "";
let progressTextElement = null;
let progressAnimationFrameId = null;
let memoryAbortController = null;
let memoryLoadGeneration = 0;
let activeConversationId = null;           // received from backend via SSE conversation_id frame


// ============================================================
// New Session feature
// ============================================================
function newSession() {
    // Clear conversation tracking
    activeConversationId = null;

    // Finalize any streaming bubbles
    finalizeChatStreamBubble();
    finalizeBackgroundBubble();

    // Clear the chat display
    chatHistory.innerHTML = "";

    // Add a visual separator indicating a new session started
    const separator = document.createElement("div");
    separator.className = "session-separator";
    separator.innerHTML = "<span>--- 新会话 ---</span>";
    chatHistory.appendChild(separator);

    // Clear conversation list active states
    for (const card of conversationList.querySelectorAll(".conversation-card")) {
        card.classList.remove("active");
    }

    // Refresh the conversation list from backend
    loadConversations();

    // Scroll to bottom
    chatUserNearBottom = true;
    chatHistory.scrollTop = chatHistory.scrollHeight;
}

// ============================================================
// 错误显示：真实 HTTP 状态 + 后端 JSON
// ============================================================
async function readJSONResponse(response, actionName) {
    if (response.ok) return response.json();
    let errorDetail = "";
    try {
        const errorJSON = await response.json();
        errorDetail = errorJSON.message || JSON.stringify(errorJSON);
    } catch (ignored) {
        errorDetail = await response.text().catch(() => "");
    }
    throw new Error(
        `${actionName}失败：HTTP ${response.status}` +
        (errorDetail ? ` — ${errorDetail}` : "")
    );
}

function appendChatError(errorText) {
    finalizeChatStreamBubble();
    finalizeBackgroundBubble();
    const errorMessage = document.createElement("div");
    errorMessage.className = "message error";
    errorMessage.innerHTML = `<div class="message-role">错误</div>`;
    const body = document.createElement("div");
    body.className = "message-body";
    body.textContent = errorText;
    errorMessage.append(body);
    removeChatEmptyState();
    chatHistory.append(errorMessage);
    chatUserNearBottom = true;
    chatHistory.scrollTop = chatHistory.scrollHeight;
}

function setServerState(connected, label) {
    serverState.className = "state-pill " + (connected ? "ok" : "bad");
    serverState.textContent = label;
}

// ============================================================
// Markdown 渲染（与 index.html 相同实现）与智能滚动
// ============================================================
function escapeHTML(sourceText) {
    return sourceText
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function renderMarkdown(sourceText) {
    const codeBlockHTMLList = [];
    let workingText = sourceText.replace(
        /```(\w*)\n?([\s\S]*?)(```|$)/g,
        (wholeMatch, languageName, codeContent) => {
            codeBlockHTMLList.push(
                `<pre class="md-pre"><code>${escapeHTML(codeContent.replace(/\n$/, ""))}</code></pre>`
            );
            return `${codeBlockHTMLList.length - 1}`;
        }
    );
    workingText = escapeHTML(workingText);
    workingText = workingText
        .replace(/`([^`\n]+)`/g, '<code class="md-code">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
        .replace(/~~([^~]+)~~/g, "<del>$1</del>")
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (wholeMatch, label, linkURL) => {
            if (/^(https?:\/\/|mailto:)/i.test(linkURL)) {
                return `<a href="${linkURL}" target="_blank" rel="noopener noreferrer">${label}</a>`;
            }
            return label;
        });
    const outputHTML = [];
    let openListType = null;
    let paragraphLines = [];
    const closeList = () => {
        if (openListType) {
            outputHTML.push(openListType === "ul" ? "</ul>" : "</ol>");
            openListType = null;
        }
    };
    const flushParagraph = () => {
        if (paragraphLines.length) {
            outputHTML.push(`<p>${paragraphLines.join("<br>")}</p>`);
            paragraphLines = [];
        }
    };
    for (const rawLine of workingText.split("\n")) {
        const trimmedLine = rawLine.trim();
        const codePlaceholder = /^(\d+)$/.exec(trimmedLine);
        let lineMatch;
        if (codePlaceholder) {
            flushParagraph(); closeList();
            outputHTML.push(codeBlockHTMLList[Number(codePlaceholder[1])]);
        } else if ((lineMatch = /^(#{1,4})\s+(.*)$/.exec(trimmedLine))) {
            flushParagraph(); closeList();
            const headingLevel = lineMatch[1].length + 1;
            outputHTML.push(`<h${headingLevel} class="md-h">${lineMatch[2]}</h${headingLevel}>`);
        } else if (/^(-{3,}|\*{3,})$/.test(trimmedLine)) {
            flushParagraph(); closeList();
            outputHTML.push('<hr class="md-hr">');
        } else if ((lineMatch = /^&gt;\s?(.*)$/.exec(trimmedLine))) {
            flushParagraph(); closeList();
            outputHTML.push(`<blockquote class="md-quote">${lineMatch[1]}</blockquote>`);
        } else if ((lineMatch = /^[-*]\s+(.*)$/.exec(trimmedLine))) {
            flushParagraph();
            if (openListType !== "ul") { closeList(); outputHTML.push("<ul>"); openListType = "ul"; }
            outputHTML.push(`<li>${lineMatch[1]}</li>`);
        } else if ((lineMatch = /^\d+[.)]\s+(.*)$/.exec(trimmedLine))) {
            flushParagraph();
            if (openListType !== "ol") { closeList(); outputHTML.push("<ol>"); openListType = "ol"; }
            outputHTML.push(`<li>${lineMatch[1]}</li>`);
        } else if (trimmedLine === "") {
            flushParagraph(); closeList();
        } else {
            paragraphLines.push(rawLine);
        }
    }
    flushParagraph(); closeList();
    return outputHTML.join("");
}

function renderMarkdownInto(targetElement, markdownText) {
    targetElement.innerHTML = renderMarkdown(markdownText);
}

chatHistory.addEventListener("scroll", () => {
    chatUserNearBottom =
        chatHistory.scrollHeight - chatHistory.scrollTop - chatHistory.clientHeight < 80;
});
progressStream.addEventListener("scroll", () => {
    progressUserNearBottom =
        progressStream.scrollHeight - progressStream.scrollTop - progressStream.clientHeight < 80;
});

// ============================================================
// 对话区气泡（用户消息 / Harness 流式回复 / 后台汇报）
// ============================================================
function removeChatEmptyState() {
    const emptyState = chatHistory.querySelector(".empty-state");
    if (emptyState) emptyState.remove();
}

function appendChatMessage(roleLabel, cssClass, text) {
    removeChatEmptyState();
    const messageElement = document.createElement("div");
    messageElement.className = `message ${cssClass}`;
    messageElement.innerHTML = `<div class="message-role">${escapeHTML(roleLabel)}</div>`;
    const body = document.createElement("div");
    body.className = "message-body";
    renderMarkdownInto(body, text);
    messageElement.append(body);
    chatHistory.append(messageElement);
    chatHistory.scrollTop = chatHistory.scrollHeight;
    return messageElement;
}

function createStreamBubble(roleLabel, cssClass) {
    removeChatEmptyState();
    const messageElement = document.createElement("div");
    messageElement.className = `message ${cssClass}`;
    messageElement.innerHTML = `<div class="message-role">${escapeHTML(roleLabel)}</div>`;
    const body = document.createElement("div");
    body.className = "message-body";
    const logElement = document.createElement("div");
    logElement.className = "bubble-log";
    messageElement.append(body, logElement);
    chatHistory.append(messageElement);
    chatHistory.scrollTop = chatHistory.scrollHeight;
    return {
        bodyElement: body,
        logElement,
        rawText: "",
        renderTimer: null,
        lastRenderTime: 0,
        lastRenderedLength: 0
    };
}

function renderBubbleNow(bubble) {
    if (!bubble || bubble.lastRenderedLength === bubble.rawText.length) return;
    if (bubble.renderTimer !== null) {
        clearTimeout(bubble.renderTimer);
        bubble.renderTimer = null;
    }
    renderMarkdownInto(bubble.bodyElement, bubble.rawText);
    bubble.lastRenderedLength = bubble.rawText.length;
    bubble.lastRenderTime = performance.now();
    if (chatUserNearBottom) chatHistory.scrollTop = chatHistory.scrollHeight;
}

function scheduleBubbleRender(bubble) {
    if (bubble.renderTimer !== null) return;
    const elapsed = performance.now() - bubble.lastRenderTime;
    const delay = Math.max(0, BUBBLE_RENDER_INTERVAL_MS - elapsed);
    bubble.renderTimer = setTimeout(() => {
        bubble.renderTimer = null;
        renderBubbleNow(bubble);
    }, delay);
}

function appendBubbleLog(bubble, logText) {
    const logLine = document.createElement("div");
    logLine.textContent = logText;
    bubble.logElement.append(logLine);
    if (chatUserNearBottom) chatHistory.scrollTop = chatHistory.scrollHeight;
}

function finalizeChatStreamBubble() {
    const bubble = chatStreamBubble;
    chatStreamBubble = null;
    renderBubbleNow(bubble);
}

function finalizeBackgroundBubble() {
    const bubble = backgroundBubble;
    backgroundBubble = null;
    renderBubbleNow(bubble);
}

// ============================================================
// Agent 事件帧处理（对话流、后台汇报、进度视图共用一套类型）
// ============================================================
function receiveChatFrame(parsedFrame) {
    if (!parsedFrame || !parsedFrame.type) return;
    switch (parsedFrame.type) {
        case "conversation_id":
            activeConversationId = parsedFrame.conversationId || parsedFrame.id || null;
            return;
        case "round_started":
            if (chatStreamBubble) {
                appendBubbleLog(chatStreamBubble, `第 ${parsedFrame.round} 轮`);
            }
            return;
        case "text_delta":
            if (!chatStreamBubble) chatStreamBubble = createStreamBubble("Harness", "harness");
            chatStreamBubble.rawText += parsedFrame.text || "";
            scheduleBubbleRender(chatStreamBubble);
            return;
        case "tool_started":
            if (chatStreamBubble) {
                appendBubbleLog(chatStreamBubble, `调用工具 ${parsedFrame.toolName}`);
            }
            return;
        case "tool_succeeded":
        case "tool_failed":
            if (chatStreamBubble) {
                appendBubbleLog(
                    chatStreamBubble,
                    `工具 ${parsedFrame.toolName} ${parsedFrame.type === "tool_succeeded" ? "完成" : "失败"}`
                );
            }
            return;
        case "agent_completed":
        case "done":
            finalizeChatStreamBubble();
            loadAgents();
            return;
        case "error":
            appendChatError(`${parsedFrame.code || "error"}: ${parsedFrame.message || "未知错误"}`);
            return;
        default:
            return;
    }
}

function receiveHarnessChannelEvent(parsedFrame) {
    if (!parsedFrame || !parsedFrame.type) return;
    switch (parsedFrame.type) {
        case "text_delta":
            if (!backgroundBubble) {
                backgroundBubble = createStreamBubble("Harness · 后台汇报", "background");
            }
            backgroundBubble.rawText += parsedFrame.text || "";
            scheduleBubbleRender(backgroundBubble);
            return;
        case "round_started":
        case "tool_started":
        case "tool_succeeded":
        case "tool_failed":
            if (backgroundBubble) {
                const logText = parsedFrame.type === "round_started"
                    ? `第 ${parsedFrame.round} 轮`
                    : `工具 ${parsedFrame.toolName}`;
                appendBubbleLog(backgroundBubble, logText);
            }
            return;
        case "agent_completed":
        case "done":
            finalizeBackgroundBubble();
            loadAgents();
            return;
        case "error":
            appendChatError(`后台 ${parsedFrame.code || "error"}: ${parsedFrame.message || "未知错误"}`);
            finalizeBackgroundBubble();
            return;
        default:
            return;
    }
}

function receiveProgressFrame(parsedFrame) {
    if (!parsedFrame || !parsedFrame.type) return;
    switch (parsedFrame.type) {
        case "text_delta": {
            const deltaText = parsedFrame.text || "";
            progressRawText += deltaText;
            progressPendingText += deltaText;
            scheduleProgressRender();
            return;
        }
        case "agent_completed":
        case "done":
            appendProgressLog("—— 完成 ——");
            loadAgents();
            return;
        default:
            appendProgressLog(progressLogLine(parsedFrame));
            return;
    }
}

function progressLogLine(parsedFrame) {
    switch (parsedFrame.type) {
        case "round_started": return `第 ${parsedFrame.round} 轮（请求 ${parsedFrame.preparedRequestTokens} tokens）`;
        case "tool_started": return `→ 调用工具 ${parsedFrame.toolName}`;
        case "tool_succeeded": return `✓ 工具 ${parsedFrame.toolName} 完成`;
        case "tool_failed": return `✗ 工具 ${parsedFrame.toolName} 失败：${parsedFrame.message || ""}`;
        case "memory_reference_ready": return `记忆文件 ${parsedFrame.sessionFile}`;
        case "current_run_compacted": return `当前轮压缩 ${parsedFrame.messagesBefore} → ${parsedFrame.messagesAfter} 条`;
        case "stored_memory_compressed": return `记忆压缩 ${parsedFrame.tokensBefore} → ${parsedFrame.tokensAfter} tokens`;
        case "error": return `错误 ${parsedFrame.code || ""}: ${parsedFrame.message || ""}`;
        default: return parsedFrame.type;
    }
}

function flushProgressRender() {
    if (progressAnimationFrameId !== null) {
        cancelAnimationFrame(progressAnimationFrameId);
        progressAnimationFrameId = null;
    }
    if (!progressPendingText) return;
    if (!progressTextElement || !progressTextElement.isConnected) {
        progressTextElement = document.createElement("div");
        progressTextElement.className = "progress-text";
        progressStream.append(progressTextElement);
    }
    progressTextElement.append(document.createTextNode(progressPendingText));
    progressPendingText = "";
    if (progressUserNearBottom) progressStream.scrollTop = progressStream.scrollHeight;
}

function scheduleProgressRender() {
    if (progressAnimationFrameId !== null) return;
    progressAnimationFrameId = requestAnimationFrame(() => {
        progressAnimationFrameId = null;
        flushProgressRender();
    });
}

function resetProgressRender() {
    if (progressAnimationFrameId !== null) cancelAnimationFrame(progressAnimationFrameId);
    progressAnimationFrameId = null;
    progressRawText = "";
    progressPendingText = "";
    progressTextElement = null;
}

function appendProgressLog(logText) {
    flushProgressRender();
    const logLine = document.createElement("div");
    logLine.className = "progress-log-line";
    logLine.textContent = logText;
    progressStream.append(logLine);
    if (progressUserNearBottom) progressStream.scrollTop = progressStream.scrollHeight;
}

// ============================================================
// 项目连接与 Agent 名单
// ============================================================
function connectProject() {
    const workingDirectory = workingDirectoryInput.value.trim();
    if (!workingDirectory) {
        appendChatError("请先填写项目绝对路径");
        return;
    }
    const projectChanged = activeWorkingDirectory !== workingDirectory;
    activeWorkingDirectory = workingDirectory;
    localStorage.setItem("harnessWorkingDirectory", workingDirectory);
    if (projectChanged) lastAgentRosterSignature = "";
    closeAgentProgress();
    openHarnessChannel();
    loadAgents();
    loadConversations();
    if (agentsPollTimer) clearInterval(agentsPollTimer);
    agentsPollTimer = setInterval(loadAgents, 10000);
}

async function loadAgents() {
    if (!activeWorkingDirectory) return;
    if (agentsLoadPending) {
        agentsLoadQueued = true;
        return;
    }
    agentsLoadPending = true;
    const requestedWorkingDirectory = activeWorkingDirectory;
    try {
        const response = await fetch(
            `/api/harness/agents?workingDirectory=${encodeURIComponent(requestedWorkingDirectory)}`
        );
        const roster = await readJSONResponse(response, "读取 Agent 名单");
        if (requestedWorkingDirectory !== activeWorkingDirectory) return;
        setServerState(true, "Go 服务已连接");
        const rosterSignature = JSON.stringify(roster);
        if (rosterSignature !== lastAgentRosterSignature) {
            lastAgentRosterSignature = rosterSignature;
            renderAgentList(roster);
        }
    } catch (loadError) {
        if (requestedWorkingDirectory !== activeWorkingDirectory) return;
        setServerState(false, "名单读取失败");
        // fetch 抛 TypeError 表示根本连不上服务（服务没启动或端口不对），
        // 和服务返回 HTTP 错误是两类故障，分开说。
        poolSummary.textContent = loadError instanceof TypeError
            ? `连不上 Go 服务：请确认 go run main.go 正在运行（${loadError.message}）`
            : loadError.message;
    } finally {
        agentsLoadPending = false;
        if (agentsLoadQueued) {
            agentsLoadQueued = false;
            queueMicrotask(loadAgents);
        }
    }
}

function renderAgentList(roster) {
    const agents = roster.agents || [];
    poolSummary.textContent =
        `池容量 ${roster.maximumAgents} · 已创建 ${agents.length} · 运行中 ${roster.runningAgents}`;
    agentList.replaceChildren();
    if (!agents.length) {
        agentList.innerHTML = `<div class="muted">还没有 Agent。在对话区告诉 Harness 你的目标。</div>`;
        return;
    }
    const rowsFragment = document.createDocumentFragment();
    for (const agentRecord of agents) {
        const row = document.createElement("div");
        row.className = "agent-row" +
            (agentRecord.name === selectedAgentName ? " selected" : "");
        row.dataset.agentName = agentRecord.name;
        const name = document.createElement("div");
        name.className = "agent-name";
        name.textContent = agentRecord.name;
        const meta = document.createElement("div");
        meta.className = "agent-meta";
        const status = document.createElement("span");
        status.className = `status-pill ${agentRecord.status}`;
        status.textContent = agentRecord.status;
        const taskCount = document.createElement("span");
        taskCount.textContent = `${agentRecord.taskCount} 个任务`;
        meta.append(status, taskCount);
        row.append(name, meta);
        row.addEventListener("click", () => selectAgent(agentRecord));
        rowsFragment.append(row);
    }
    agentList.append(rowsFragment);
}

// ============================================================
// Agent 进度（逐 token）与记忆
// ============================================================
function selectAgent(agentRecord) {
    if (selectedAgentName === agentRecord.name
        && selectedAgentConversationId === agentRecord.conversationId) return;

    selectedAgentName = agentRecord.name;
    selectedAgentConversationId = agentRecord.conversationId;
    detailTitle.textContent = `Agent 进度 · ${agentRecord.name}`;
    progressStream.replaceChildren();
    resetProgressRender();
    loadMemoryButton.disabled = false;
    memoryView.replaceChildren();
    for (const row of agentList.querySelectorAll(".agent-row")) {
        row.classList.toggle("selected", row.dataset.agentName === selectedAgentName);
    }
    openAgentProgress();
    scheduleMemoryLoad();
}

function openAgentProgress() {
    if (progressEventSource) progressEventSource.close();
    progressEventSource = null;
    if (!selectedAgentConversationId) return;
    const eventSource = new EventSource(
        `/api/conversations/${encodeURIComponent(selectedAgentConversationId)}/events`
    );
    progressEventSource = eventSource;
    eventSource.onmessage = browserMessageEvent => {
        if (progressEventSource !== eventSource) return;
        try {
            receiveProgressFrame(JSON.parse(browserMessageEvent.data));
        } catch (decodeError) {
            appendProgressLog(`事件解析失败：${decodeError.message}`);
        }
    };
}

function closeAgentProgress() {
    if (progressEventSource) progressEventSource.close();
    progressEventSource = null;
    if (memoryAbortController) memoryAbortController.abort();
    memoryAbortController = null;
    memoryLoadGeneration += 1;
    selectedAgentName = null;
    selectedAgentConversationId = null;
    resetProgressRender();
    loadMemoryButton.disabled = true;
}

function scheduleMemoryLoad() {
    const run = () => loadMemory();
    if ("requestIdleCallback" in window) {
        window.requestIdleCallback(run, { timeout: 300 });
    } else {
        setTimeout(run, 0);
    }
}

async function loadMemory() {
    if (!selectedAgentName || !activeWorkingDirectory) return;
    if (memoryAbortController) memoryAbortController.abort();
    const abortController = new AbortController();
    memoryAbortController = abortController;
    const generation = ++memoryLoadGeneration;
    const agentName = selectedAgentName;
    const workingDirectory = activeWorkingDirectory;
    memoryView.replaceChildren();
    try {
        const response = await fetch(
            `/api/harness/agents/${encodeURIComponent(agentName)}/memory` +
            `?workingDirectory=${encodeURIComponent(workingDirectory)}`,
            { signal: abortController.signal }
        );
        const memory = await readJSONResponse(response, "读取 Agent 记忆");
        if (generation !== memoryLoadGeneration || agentName !== selectedAgentName) return;
        renderMemory(memory);
    } catch (loadError) {
        if (loadError.name === "AbortError" || generation !== memoryLoadGeneration) return;
        const errorBox = document.createElement("div");
        errorBox.className = "inline-error";
        errorBox.textContent = loadError.message;
        memoryView.append(errorBox);
    } finally {
        if (memoryAbortController === abortController) memoryAbortController = null;
    }
}

function renderMemory(memory) {
    memoryView.replaceChildren();
    const summary = document.createElement("div");
    summary.className = "muted";
    summary.textContent = `${memory.title || "(无标题)"} · ${(memory.messages || []).length} 条消息`;
    memoryView.append(summary);
    for (const message of memory.messages || []) {
        const messageElement = document.createElement("div");
        messageElement.className = "memory-message";
        const role = document.createElement("div");
        role.className = "memory-role";
        role.textContent = message.role === "user" ? "任务" : "Agent";
        const body = document.createElement("div");
        const textParts = (message.content || [])
            .filter(contentBlock => contentBlock.type === "text")
            .map(contentBlock => contentBlock.text || "");
        renderMarkdownInto(body, textParts.join("\n") || "(非文本内容)");
        messageElement.append(role, body);
        memoryView.append(messageElement);
    }
}

// ============================================================
// Harness 后台汇报频道
// ============================================================
function openHarnessChannel() {
    finalizeBackgroundBubble();
    if (harnessEventSource) harnessEventSource.close();
    harnessEventSource = null;
    const eventSource = new EventSource(
        `/api/conversations/${encodeURIComponent("harness")}/events`
    );
    harnessEventSource = eventSource;
    eventSource.onopen = () => {
        if (harnessEventSource === eventSource) setServerState(true, "Go 服务已连接");
    };
    eventSource.onmessage = browserMessageEvent => {
        if (harnessEventSource !== eventSource) return;
        try {
            receiveHarnessChannelEvent(JSON.parse(browserMessageEvent.data));
        } catch (decodeError) {
            appendChatError(`后台事件解析失败：${decodeError.message}`);
        }
    };
    eventSource.onerror = () => {
        if (harnessEventSource !== eventSource) return;
        // EventSource 会自动重连；先封口当前气泡，避免重连后的新任务串到旧内容。
        finalizeBackgroundBubble();
        setServerState(false, "后台通道重连中");
    };
}

// ============================================================
// 发送消息（POST SSE）
// ============================================================
function receiveSSEFrameText(frameText, frameReceiver) {
    const dataLines = frameText
        .split(/\r?\n/)
        .filter(line => line.startsWith("data:"))
        .map(line => line.slice(5).replace(/^ /, ""));
    if (!dataLines.length) return;
    frameReceiver(JSON.parse(dataLines.join("\n")));
}


async function requestStopHarnessChat() {
    try {
        await fetch(`/api/conversations/${encodeURIComponent(HARNESS_CONVERSATION_ID)}/stop`, {
            method: "POST"
        });
        appendBubbleLogSafe("已请求停止 Harness");
    } catch (stopError) {
        appendBubbleLogSafe(`停止请求失败：${stopError.message}`);
    }
    if (activeChatAbortController) activeChatAbortController.abort();
}

async function submitChat() {
    const message = chatInput.value.trim();
    if (!activeWorkingDirectory) {
        appendChatError("请先填写项目绝对路径并点击「连接」");
        return;
    }
    if (!message || sendButton.disabled) return;

    appendChatMessage("你", "user", message);
    chatInput.value = "";
    chatUserNearBottom = true;
    finalizeChatStreamBubble();
    sendButton.disabled = true;
    sendButton.textContent = "执行中";
    stopButton.hidden = false;
    stopButton.disabled = false;
    activeChatAbortController = new AbortController();

    try {
        const streamResponse = await fetch("/api/harness/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                workingDirectory: activeWorkingDirectory,
                message: message,
                conversationId: activeConversationId || ""
            }),
            signal: activeChatAbortController.signal
        });
        if (!streamResponse.ok) {
            await readJSONResponse(streamResponse, "发送消息");
        }
        if (!streamResponse.body) throw new Error("Go 服务没有返回 SSE 数据流");
        setServerState(true, "Go 服务已连接");

        const streamReader = streamResponse.body.getReader();
        const textDecoder = new TextDecoder("utf-8");
        let undecodedText = "";
        while (true) {
            const { value, done } = await streamReader.read();
            undecodedText += textDecoder.decode(value || new Uint8Array(), { stream: !done });
            const frames = undecodedText.split(/\r?\n\r?\n/);
            undecodedText = frames.pop() || "";
            for (const frame of frames) {
                try {
                    receiveSSEFrameText(frame, eventObject => {
                        if (eventObject && (eventObject.type === "cancelled" || eventObject.resultKind === "cancelled")) {
                            appendBubbleLogSafe(`已停止：${eventObject.reason || "user_stop"}`);
                        }
                        receiveChatFrame(eventObject);
                    });
                } catch (parseError) {
                    appendBubbleLogSafe(`帧解析失败：${parseError.message}`);
                }
            }
            if (done) {
                if (undecodedText.trim()) {
                    try {
                        receiveSSEFrameText(undecodedText, receiveChatFrame);
                    } catch (parseError) {
                        appendBubbleLogSafe(`尾帧解析失败：${parseError.message}`);
                    }
                }
                break;
            }
        }
    } catch (runError) {
        if (runError && runError.name === "AbortError") {
            appendBubbleLogSafe("用户停止或页面中断");
        } else {
            appendChatError(runError.message);
            setServerState(false, "请求失败");
        }
    } finally {
        finalizeChatStreamBubble();
        sendButton.disabled = false;
        sendButton.textContent = "发送";
        stopButton.hidden = true;
        stopButton.disabled = true;
        activeChatAbortController = null;
        loadAgents();
    }
}

function formatTime(epochSeconds) {
    if (!epochSeconds) return "未知时间";
    return new Date(epochSeconds * 1000).toLocaleString("zh-CN", {
        month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
    });
}

async function loadConversations() {
    if (!activeWorkingDirectory) {
        conversationList.innerHTML = '<div class="muted">请先连接项目。</div>';
        return;
    }
    try {
        const response = await fetch(
            `/api/conversations?workingDirectory=${encodeURIComponent(activeWorkingDirectory)}`
        );
        const summaries = await readJSONResponse(response, "读取会话列表");
        renderConversationList(Array.isArray(summaries) ? summaries : []);
    } catch (loadError) {
        const errorBox = document.createElement("div");
        errorBox.className = "inline-error";
        errorBox.textContent = loadError.message;
        conversationList.replaceChildren(errorBox);
    }
}

function renderConversationList(conversationSummaries) {
    conversationList.replaceChildren();
    if (!conversationSummaries.length) {
        conversationList.innerHTML = '<div class="muted">还没有会话。</div>';
        return;
    }
    for (const summary of conversationSummaries) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "conversation-card";
        card.dataset.conversationId = summary.conversationId;
        card.title = summary.title || "未命名会话";
        const titleEl = document.createElement("span");
        titleEl.className = "conversation-title";
        titleEl.textContent = summary.title || "未命名会话";
        const meta = document.createElement("span");
        meta.className = "conversation-meta";
        const time = document.createElement("span");
        time.textContent = formatTime(summary.updatedAt);
        const count = document.createElement("span");
        count.textContent = `${summary.messageCount || summary.currentWindowTokens || 0} 条消息`;
        meta.append(time, count);
        card.append(titleEl, meta);
        card.addEventListener("click", () => loadConversation(summary.conversationId));
        conversationList.append(card);
    }
}

async function loadConversation(conversationId) {
    try {
        const response = await fetch(
            `/api/conversations/${encodeURIComponent(conversationId)}` +
            `?workingDirectory=${encodeURIComponent(activeWorkingDirectory)}`
        );
        const session = await readJSONResponse(response, "读取会话历史");
        renderConversationHistory(session);
        for (const card of conversationList.querySelectorAll(".conversation-card")) {
            card.classList.toggle("active", card.dataset.conversationId === conversationId);
        }
    } catch (loadError) {
        appendChatError(loadError.message);
    }
}

function renderConversationHistory(session) {
    finalizeChatStreamBubble();
    finalizeBackgroundBubble();
    chatHistory.replaceChildren();
    const messages = Array.isArray(session.messages) ? session.messages : [];
    if (!messages.length) {
        chatHistory.innerHTML = '<div class="empty-state">这个会话还没有历史记录。</div>';
        return;
    }
    for (const message of messages) {
        const role = message.role;
        const textParts = (message.content || [])
            .filter(block => block.type === "text")
            .map(block => block.text || "");
        const text = textParts.join("\n") || "(非文本内容)";
        const cssClass = role === "user" ? "user" : "";
        const roleLabel = role === "user" ? "用户" : role === "assistant" ? "Agent" : role;
        appendChatMessage(roleLabel, cssClass, text);
    }
    chatHistory.scrollTop = chatHistory.scrollHeight;
}

<script>
// ============================================================
// 状态驱动动画观察器（阶段2）：零改动业务逻辑，只把真实运行时状态映射到 body[data-harness-state]
// 状态：idle / thinking（agent 思考·text_delta 流式渲染中）/ tool（工具调用中）/ working（AGENTS 工作中）
// ============================================================
(function () {
    "use strict";
    var body = document.body;
    var lastLen = -1;
    function setState(s) {
        if (body.getAttribute("data-harness-state") !== s) {
            body.setAttribute("data-harness-state", s);
        }
    }
    function evaluate() {
        var stopBtn = document.getElementById("stop-button");
        var sendBtn = document.getElementById("send-button");
        var chatHistory = document.getElementById("chat-history");
        var working = stopBtn && !stopBtn.hidden;
        if (!working && sendBtn && sendBtn.textContent.indexOf("执行中") >= 0) working = true;
        var tool = false;
        var thinking = false;
        if (chatHistory) {
            var logs = chatHistory.querySelectorAll(".bubble-log");
            for (var i = 0; i < logs.length; i++) {
                var t = logs[i].textContent || "";
                if (t.indexOf("调用工具") >= 0 || t.indexOf("工具") >= 0) { tool = true; break; }
            }
            var len = chatHistory.textContent.length;
            if (lastLen >= 0 && len > lastLen) thinking = true;
            lastLen = len;
        }
        setState(working ? "working" : (tool ? "tool" : (thinking ? "thinking" : "idle")));
    }
    var mo = new MutationObserver(evaluate);
    mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden"] });
    setInterval(evaluate, 600);
    evaluate();
})();
</script>
<script>
// ============================================================
// 动态全息主题增强（仅 dynamic 主题生效）：粒子 + 思考气泡 + 失败气泡
// 独立块：不修改任何现有业务逻辑，只读 DOM + 拉取 roster 做可视化
// ============================================================
(function () {
    "use strict";
    var particleLayer = document.querySelector(".particle-layer");
    var workOrbit = document.querySelector(".work-orbit");
    if (!particleLayer || !workOrbit) return;

    var enabled = (document.documentElement.dataset.theme === "dynamic");
    var themeSelect = document.getElementById("theme-select");
    var workingDirectory = "";
    var wdInput = document.getElementById("working-directory");

    // 折叠切换：点一下收起 / 再点一下张开（覆盖 hover 行为）
    var agentsPanel = document.querySelector(".agents-panel");
    var detailPanel = document.querySelector(".detail-panel");
    var agentsCollapsed = true;
    var detailCollapsed = true;
    function applyCollapse() {
        if (!enabled) return;
        if (agentsPanel) agentsPanel.classList.toggle("collapsed", agentsCollapsed);
        if (detailPanel) detailPanel.classList.toggle("collapsed", detailCollapsed);
    }
    if (agentsPanel) agentsPanel.addEventListener("click", function (e) {
        if (e.target.closest("button")) return; // 点按钮不折叠
        agentsCollapsed = !agentsCollapsed; applyCollapse();
    });
    if (detailPanel) detailPanel.addEventListener("click", function (e) {
        if (e.target.closest("button")) return;
        detailCollapsed = !detailCollapsed; applyCollapse();
    });

    function setEnabled(on) {
        enabled = on;
        if (on) {
            if (!particleLayer.querySelectorAll(".part").length) spawnParticles();
            applyCollapse();
            refreshAgents();
        } else {
            particleLayer.querySelectorAll(".part").forEach(function (n) { n.remove(); });
            workOrbit.querySelectorAll(".bubble").forEach(function (n) { n.remove(); });
            closeAllStreams();
        }
    }
    if (themeSelect) themeSelect.addEventListener("change", function () { setEnabled(themeSelect.value === "dynamic"); });
    if (wdInput) wdInput.addEventListener("input", function () { workingDirectory = wdInput.value.trim(); });

    // ---- 工作 Agent 专属色板（按名字哈希稳定分配，区别于主管理青色） ----
    var AGENT_COLORS = [
        "#ffc94d", // 琥珀金
        "#ff7eb6", // 玫红
        "#7bffb0", // 薄荷
        "#c07bff", // 紫罗兰
        "#ff9e6b", // 橙
        "#eaff6b", // 柠檬黄绿
        "#ff6bf0", // 品红
        "#ff8a8a"  // 珊瑚
    ];
    function hashColor(name) {
        var h = 0;
        for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
        return AGENT_COLORS[h % AGENT_COLORS.length];
    }
    function hexToRgba(hex, alpha) {
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
    }

    // ---- 粒子系统（双色：主管理青色 + 工作 Agent 专属色随机） ----
    function spawnParticles() {
        for (var i = 0; i < 30; i++) {
            var p = document.createElement("div");
            p.className = "part";
            var gold = AGENT_COLORS[Math.floor(Math.random() * AGENT_COLORS.length)];
            p.style.background = "radial-gradient(circle, " + hexToRgba(gold, .9) + ", transparent 70%)";
            if (i % 2 === 0) {
                p.style.background = "radial-gradient(circle, rgba(56,224,255,.8), transparent 70%)";
            }
            var size = 2 + Math.random() * 4;
            p.style.width = size + "px";
            p.style.height = size + "px";
            p.style.left = (Math.random() * 100) + "%";
            p.style.animationDelay = (Math.random() * 4) + "s";
            p.style.animationDuration = (3 + Math.random() * 5) + "s";
            particleLayer.appendChild(p);
        }
    }

    // ---- 气泡管理 ----
    var runningStreams = {};  // name -> {es, el, textEl}
    var failedBubbles = {};   // name -> el
    function bubbles() { return workOrbit.querySelectorAll(".bubble"); }

    function ensureRunningBubble(name, conversationId) {
        if (runningStreams[name]) return;
        // 专属配色 + 动画参数 + 特效（按名字哈希，稳定且各不相同）
        var color = hashColor(name);
        var colorSoft = hexToRgba(color, .20);
        var colorBorder = hexToRgba(color, .55);
        var colorGlow = hexToRgba(color, .35);
        var colorText = hexToRgba(color, .95);
        // 动画变体：不同 Agent 不同浮动节奏 / 位移 / 旋转（哈希选择，稳定）
        var motionVariants = [
            { dur: "3.2s", y: -10, x: 0,  rot: 0,   peak: .35 },
            { dur: "4.1s", y: 0,  x: 9,  rot: 1.5, peak: .30 },
            { dur: "3.6s", y: -6, x: -6, rot: -1,  peak: .40 },
            { dur: "4.6s", y: 8,  x: 4,  rot: 0,   peak: .25 },
            { dur: "3.4s", y: -12, x: 5, rot: 2,  peak: .45 },
            { dur: "4.3s", y: 4,  x: -8, rot: -1.5,peak: .30 },
            { dur: "3.8s", y: -8, x: 7,  rot: 1,   peak: .35 },
            { dur: "4.8s", y: 6,  x: 0,  rot: -2,  peak: .28 }
        ];
        var variant = motionVariants[hashColor(name).length % motionVariants.length];
        var animName = "agentFloat" + (hashColor(name).length % 8);
        // 为该 Agent 注入专属关键帧（不同位移/旋转/节奏）
        var styleEl = document.createElement("style");
        styleEl.textContent = "@keyframes " + animName + " {" +
            "0%,100% { transform: translate(0,0) rotate(0); opacity:.9 } " +
            (variant.peak * 100) + "% { transform: translate(" + variant.x + "px," + variant.y + "px) rotate(" + variant.rot + "deg); opacity:1 }" +
            "}";
        document.head.appendChild(styleEl);
        var b = document.createElement("div");
        b.className = "bubble bubble-running";
        // 注入专属配色：不透明深色实底 + 专属色描边辉光（悬浮不叠字）
        b.style.background = "linear-gradient(135deg, rgba(22,28,44,.97), rgba(16,20,34,.97))";
        b.style.borderColor = colorBorder;
        b.style.boxShadow = "0 0 22px " + colorGlow + ", inset 0 0 12px " + hexToRgba(color, .08);
        b.style.animation = animName + " " + variant.dur + " ease-in-out infinite";
        var head = document.createElement("div");
        head.className = "bubble-head";
        head.style.color = colorText;
        var dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = color;
        dot.style.boxShadow = "0 0 8px " + hexToRgba(color, .8);
        var label = document.createElement("span");
        label.textContent = name;
        head.append(dot, label);
        var textEl = document.createElement("div");
        textEl.className = "bubble-think";
        textEl.style.color = hexToRgba(color, .8);
        textEl.style.borderTopColor = hexToRgba(color, .25);
        textEl.textContent = "思考中…";
        b.append(head, textEl);
        // 轨道内流式排布：气泡用 flex 列自动堆叠，永不重叠
        var lane = document.getElementById("lane-running");
        if (!lane) {
            lane = document.createElement("div");
            lane.id = "lane-running";
            lane.style.cssText = "position:fixed;left:88px;top:110px;bottom:90px;width:250px;display:flex;flex-direction:column;gap:22px;overflow:hidden;z-index:6;pointer-events:none";
            workOrbit.appendChild(lane);
        }
        lane.appendChild(b);
        runningStreams[name] = { el: b, textEl: textEl, es: null, animName: animName, animDur: variant.dur, color: color };
        // 开 EventSource 捕获思考过程（text_delta）
        if (conversationId && workingDirectory) {
            var es = new EventSource(
                "/api/conversations/" + encodeURIComponent(conversationId) +
                "/events?workingDirectory=" + encodeURIComponent(workingDirectory)
            );
            runningStreams[name].es = es;
            es.onmessage = function (ev) {
                try {
                    var frame = JSON.parse(ev.data);
                    if (frame.type === "text_delta" && frame.text) {
                        appendThinkText(runningStreams[name], frame.text);
                    } else if (frame.type === "tool_started" && frame.toolName) {
                        appendThinkText(runningStreams[name], " [工具:" + frame.toolName + "] ");
                    } else if (frame.type === "tool_failed") {
                        appendThinkText(runningStreams[name], " [工具失败] ");
                    }
                } catch (e) { /* 忽略解析错误 */ }
            };
        }
    }
    function appendThinkText(entry, text) {
        if (!entry || !entry.textEl) return;
        entry.textEl.textContent += text;
        if (entry.textEl.textContent.length > 400) {
            entry.textEl.textContent = entry.textEl.textContent.slice(-400);
        }
    }
    function removeRunningBubble(name) {
        var entry = runningStreams[name];
        if (!entry) return;
        if (entry.es) { try { entry.es.close(); } catch (e) {} }
        if (entry.el) entry.el.remove();
        // 清理为该 Agent 注入的动态 keyframes style，避免累积
        if (entry.animName) {
            var styles = document.querySelectorAll("style");
            for (var i = 0; i < styles.length; i++) {
                if (styles[i].textContent.indexOf("@keyframes " + entry.animName) >= 0) {
                    styles[i].remove();
                }
            }
        }
        delete runningStreams[name];
    }

    function ensureFailedBubble(name) {
        if (failedBubbles[name]) return;
        // 失败气泡沿用该 Agent 专属色，但降低饱和度 + 红色倾向（失败语义）
        var color = hashColor(name);
        var b = document.createElement("div");
        b.className = "bubble bubble-failed";
        // 不透明深色实底 + 专属色描边（悬浮不叠字）
        b.style.background = "linear-gradient(135deg, rgba(38,20,32,.97), rgba(26,14,22,.97))";
        b.style.borderColor = hexToRgba(color, .6);
        b.style.color = color;
        b.style.boxShadow = "0 0 20px " + hexToRgba(color, .22) + ", inset 0 0 10px " + hexToRgba(color, .06);
        var label = document.createElement("span");
        label.textContent = "✗ " + name + " 失败";
        b.appendChild(label);
        // 右侧轨道：flex 列自动堆叠，永不重叠
        var lane = document.getElementById("lane-failed");
        if (!lane) {
            lane = document.createElement("div");
            lane.id = "lane-failed";
            lane.style.cssText = "position:fixed;right:88px;top:110px;bottom:90px;width:210px;display:flex;flex-direction:column;align-items:flex-end;gap:16px;overflow:hidden;z-index:6;pointer-events:none";
            workOrbit.appendChild(lane);
        }
        lane.appendChild(b);
        failedBubbles[name] = b;
    }
    function removeFailedBubble(name) {
        if (failedBubbles[name]) {
            failedBubbles[name].remove();
            delete failedBubbles[name];
        }
    }

    // ---- 拉取 roster 并同步气泡 ----
    function refreshAgents() {
        if (!enabled) return;
        if (!workingDirectory && wdInput) workingDirectory = wdInput.value.trim();
        if (!workingDirectory) return;
        fetch("/api/harness/agents?workingDirectory=" + encodeURIComponent(workingDirectory))
            .then(function (r) { return r.json(); })
            .then(function (roster) {
                var agents = roster.agents || [];
                var runningNow = {};
                var failedNow = {};
                agents.forEach(function (a) {
                    if (a.status === "running") {
                        runningNow[a.name] = true;
                        ensureRunningBubble(a.name, a.conversationId);
                    } else if (a.status === "failed") {
                        failedNow[a.name] = true;
                        ensureFailedBubble(a.name);
                    }
                });
                Object.keys(runningStreams).forEach(function (n) {
                    if (!runningNow[n]) removeRunningBubble(n);
                });
                Object.keys(failedBubbles).forEach(function (n) {
                    if (!failedNow[n]) removeFailedBubble(n);
                });
            })
            .catch(function () { /* 服务未连接时静默 */ });
    }

    function closeAllStreams() {
        Object.keys(runningStreams).forEach(removeRunningBubble);
    }

    setInterval(refreshAgents, 2000);
    setEnabled(enabled);
})();
</script>
})();
</script>

</script>
